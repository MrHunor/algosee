name: Build executable and publish

on: 
  workflow_run:
    workflows: ["Test Executable"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: | # AI made
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
      && (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest

    steps:
     - name: Checkout repository
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

     - name: Update outputs
       shell: bash
       run: | 
         pacman -Syu --noconfirm

     - name: Install Build Tools
       shell: bash 
       run: |
        pacman -S --noconfirm \
        base-devel \
        cmake \
        git \
        curl \
        github-cli \
        python \
        python-pipx \
        python-filelock \ 
        ninja

     - name: Install Conan and configure # weird command syntax but should work like this
       shell: bash
       run: |
        pipx install conan
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        conan profile detect --force

     - name: Build executable 
       shell: bash
       run: |
        ./rebuildLinuxRelease.sh 

     - name: Create new GitHub release
       shell: bash
       env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message || '' }} # either use the commit message used in the test workflow or empty (if failed)
       run: |
          TAG="build-${{ github.run_number }}"
          TITLE="Algosee Nightly Build ${{ github.run_number }}"

          gh release create "$TAG" \
            build/algosee \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Nightly build from commit ${{ github.sha }}. This is a running release from either the development branch or main, if you want a stable version check the latest sha of the latest main commit and reference with a nighly build as others might be unstable.

            Commit message:
            $MESSAGE" 