<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AlgoSee - Visualisierung</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-link"><h1 class="logo">AlgoSee</h1></a>
    </header>

    <main class="visualizer-container">
        <div class="visualizer-header">
            <h2 id="algo-title">Laden...</h2>
            <div class="controls">
                <button id="start-btn" class="control-btn primary">Sortieren starten</button>
                <button id="reset-btn" class="control-btn secondary">Neu generieren</button>
            </div>
        </div>

        <!-- Hier entstehen die blauen Balken -->
        <div id="array-container" class="array-container"></div>
    </main>

    <script src="js/visualizer.js"></script>
</body>
</html>
