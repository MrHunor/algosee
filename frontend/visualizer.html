<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AlgoSee - Visualization</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-link"><h1 class="logo">AlgoSee</h1></a>
    </header>

    <main class="visualizer-container">
        <div class="visualizer-header">
            <h2 id="algo-title">loading...</h2>
          <!-- slider for array-size -->
            <div class="size-control" style="display: flex; align-items: center; gap: 0.5rem; color: #cbd5e1;">
                <label for="array-size-slider">size: <span id="size-val">15</span></label>
                <input type="range" id="array-size-slider" min="3" max="50" value="15" style="cursor: pointer;">
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn primary">start sorting</button>
                <button id="reset-btn" class="control-btn secondary">generate new array</button>
            </div>
        </div>
        </div>

        <!-- Draws the bars-->
        <div id="array-container" class="array-container"></div>
    </main>

    <script src="js/visualizer.js"></script>
</body>
</html>
