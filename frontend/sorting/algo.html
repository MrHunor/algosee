<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AlgoSee - Details</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-link"><h1 class="logo">AlgoSee</h1></a>
    </header>

    <main class="algo-detail-container">
        <!-- Left side: Title, Image, Play -->
        <div class="algo-left-column">
            <div class="algo-preview-box">
                <span class="preview-text">Preview</span>
            </div>
            
            <a id="visualizer-link" href="#" class="play-button">
                <svg class="play-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M8 5v14l11-7z"/>
                </svg>
                <span>start visualization</span>
            </a>

            <!-- compare section -->
            <div class="compare-section compare-box-layout">
                <label for="compare-select" class="compare-label-text">compare with:</label>
                <select id="compare-select" class="compare-select-dropdown cursor-pointer">
                    <!-- dynamic -->
                </select>
                <button id="compare-btn" class="play-button compare-action-btn">
                    <span>Start Comparison</span>
                </button>
            </div>

            <h2 id="algo-name" class="algo-main-title">loading...</h2>
        </div>

        <!-- right: long description -->
        <div class="algo-right-column">
            <div class="description-card">
                <h3>description</h3>
                <p id="algo-description">Info to algorithm loading...</p>

                <div class="complexity">
                    <p><strong>Time Complexity:</strong> <span id="time-complexity"></span></p>
                    <p><strong>Space Complexity:</strong> <span id="space-complexity"></span></p>
                </div>
                <!-- wiki credits -->
                <div class="wiki-source">
                    Source: <a id="wiki-link" href="#" target="_blank" rel="noopener noreferrer">Wikipedia</a>
                </div>
                <!-- Server-Switch UI -->
                <div class="server-switch server-switch-wrapper">
                    <span>Server:</span>
                    <label class="cursor-pointer"><input type="radio" name="server-target" value="remote" checked> Remote (Render)</label>
                    <label class="cursor-pointer"><input type="radio" name="server-target" value="local"> Localhost</label>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const algoKey = urlParams.get('algo') || 'bogo';

        const algoDatabase = {
            bogo: {
                name: "BogoSort",
                description: "Bogosort (also known as permutation sort and stupid sort is a sorting algorithm based on the generate and test paradigm. The function successively generates permutations of its input until it finds one that is sorted. It is not considered useful for sorting, but may be used for educational purposes, to contrast it with more efficient algorithms. The algorithm's name is a portmanteau of the words bogus and sort.",
                wikiUrl: "https://en.wikipedia.org/wiki/Bogosort",
                timeComplexity:"O(n*n!) or O(INFINITY)",
                spaceComplexity:"O(1)"
            },
            miracle: {
                name: "MiracleSort",
                description: "The Most Reliably Unreliable Sorting Method: Create an array; Check to see if array is sorted; Wait a while; Check again to see if array is sorted; Repeat until array happens to be sorted by a miracle",
                wikiUrl: "https://en.wikipedia.org/wiki/Bogosort#Miracle_sort",
                timeComplexity:"O(INFINITY)",
                spaceComplexity:"O(1)"
            },
            selection: {
                name: "SelectionSort",
                description: "Selection sort is an in-place comparison sorting algorithm. It has a O time complexity, which makes it inefficient on large lists, and generally performs worse than the similar insertion sort. Selection sort is noted for its simplicity and has performance advantages over more complicated algorithms in certain situations, particularly where auxiliary memory is limited.",
                wikiUrl: "https://en.wikipedia.org/wiki/Selection_sort",
                timeComplexity:"O(n²)",
                spaceComplexity:"O(1)"
            },
            merge: {
                name: "MergeSort",
                description: "Merge sort (also commonly spelled as mergesort or merge-sort) is an efficient, general-purpose, comparison-based sorting algorithm. Most implementations of merge sort are stable, which means that the relative order of equal elements is the same between the input and output. Merge sort is a divide-and-conquer algorithm that was invented by John von Neumann in 1945. A detailed description and analysis of bottom-up merge sort appeared in a report by Goldstine and von Neumann as early as 1948.",
                wikiUrl: "https://en.wikipedia.org/wiki/Merge_sort",
                timeComplexity:"O(n log n)",
                spaceComplexity:"O(n)"
            },
            bubble: {
                name: "BubbleSort",
                description: "Bubble sort, sometimes referred to as sinking sort, is a simple sorting algorithm that repeatedly steps through the input list element by element, comparing the current element with the one after it, swapping their values if needed. These passes through the list are repeated until no swaps have to be performed during a pass, meaning that the list has become fully sorted. The algorithm, which is a comparison sort, is named for the way the larger elements bubble up to the top of the list.",
                wikiUrl: "https://en.wikipedia.org/wiki/Bubble_sort",
                timeComplexity:"O(n²)",
                spaceComplexity:"O(1)"
            },
            counting: {
                name: "CountingSort",
                description: "Counting sort is an algorithm for sorting a collection of objects according to keys that are small positive integers; that is, it is an integer sorting algorithm. It operates by counting the number of objects that possess distinct key values, and applying prefix sum on those counts to determine the positions of each key value in the output sequence. Its running time is linear in the number of items and the difference between the maximum key value and the minimum key value, so it is only suitable for direct use in situations where the variation in keys is not significantly greater than the number of items. It is often used as a subroutine in radix sort, another sorting algorithm, which can handle larger keys more efficiently.",
                wikiUrl: "https://en.wikipedia.org/wiki/Counting_sort",
                timeComplexity:"O(n+k); where k is the number of non negative key values (=max-min+1)",
                spaceComplexity:"O(n+k)"
            },
            quick: {
                name: "QuickSort",
                description: "Quicksort is an efficient, general-purpose sorting algorithm. Quicksort was developed by British computer scientist Tony Hoare in 1959 and published in 1961. It is still a commonly used algorithm for sorting. Overall, it is slightly faster than merge sort and heapsort for randomized data, particularly on larger distributions.",
                wikiUrl: "https://en.wikipedia.org/wiki/Quicksort",
                timeComplexity:"O(n log n)",
                spaceComplexity:"O(log n)"
            },
            cycle: {
                name: "CycleSort",
                description: "Cycle sort is an in-place, unstable sorting algorithm, a comparison sort that is theoretically optimal in terms of the total number of writes to the original array. It is based on the idea that the permutation to be sorted can be factored into cycles, which can individually be rotated to give a sorted result.",
                wikiUrl: "https://en.wikipedia.org/wiki/Cycle_sort",
                timeComplexity:"O(n²)",
                spaceComplexity:"O(1)"
            },
            radix: {
                name: "RadixSort",
                description: "Radix sort is a non-comparative sorting algorithm. It avoids comparison by creating and distributing elements into buckets according to their radix. For elements with more than one significant digit, this bucketing process is repeated for each digit, while preserving the ordering of the prior step, until all digits have been considered. For this reason, radix sort has also been called bucket sort and digital sort.",
                wikiUrl: "https://en.wikipedia.org/wiki/Radix_sort",
                timeComplexity:"O(n · k)",
                spaceComplexity:"O(n + b)"
            },
            intro: {
                name: "IntroSort",
                description: "Introsort or introspective sort is a hybrid sorting algorithm that provides both fast average performance and (asymptotically) optimal worst-case performance. It begins with quicksort, it switches to heapsort when the recursion depth exceeds a level based on (the logarithm of) the number of elements being sorted and it switches to insertion sort when the number of elements is below some threshold.",
                wikiUrl: "https://en.wikipedia.org/wiki/Introsort",
                timeComplexity:"O(n log n)",
                spaceComplexity:"O(log n)"
            }
        };

        const compareSelect = document.getElementById('compare-select');
        const compareBtn = document.getElementById('compare-btn');

        for (const [key, algoData] of Object.entries(algoDatabase)) {
            if (key !== algoKey) {
                const option = document.createElement('option');
                option.value = key;
                option.innerText = algoData.name;
                compareSelect.appendChild(option);
            }
        }

        compareBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const selectedAlgo2 = compareSelect.value;
            const selectedServer = document.querySelector('input[name="server-target"]:checked').value;
            if (!selectedAlgo2) {
                alert("Please choose an algorithm to compare");
                return;
            }

            window.location.href = `compare.html?algo1=${algoKey}&algo2=${selectedAlgo2}&server=${selectedServer}`;
        });

        const data = algoDatabase[algoKey] || {
            name: "unknown algorithm",
            description: "No Details for this Algorithm",
            wikiUrl: "https://www.wikipedia.org"
        };

        document.getElementById('page-title').innerText = `AlgoSee - ${data.name}`;
        document.getElementById('algo-name').innerText = data.name;
        document.getElementById('algo-description').innerText = data.description;
        document.getElementById('time-complexity').innerText = data.timeComplexity;
        document.getElementById('space-complexity').innerText = data.spaceComplexity;
        
        const wikiLinkElement = document.getElementById('wiki-link');
        wikiLinkElement.href = data.wikiUrl;
        wikiLinkElement.innerText = "Wikipedia";

        function updateVisualizerLink() {
        const selectedServer = document.querySelector('input[name="server-target"]:checked').value;
        document.getElementById('visualizer-link').href = `/loading.html?dir=sorting&algo=${algoKey}&server=${selectedServer}`;
        }

        document.querySelectorAll('input[name="server-target"]').forEach(input => {
            input.addEventListener('change', updateVisualizerLink);
        });

        updateVisualizerLink();
    </script>
</body>
</html>
