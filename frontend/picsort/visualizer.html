<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AlgoSee - Image Visualization</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-link"><h1 class="logo">AlgoSee</h1></a>
    </header>

   <main class="visualizer-container" style="max-width: 950px;">
        <div class="visualizer-header">
            <h2 id="algo-title">loading...</h2>
            
            <!-- controls (picture upload) -->
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div class="size-control" style="display: flex; align-items: center; gap: 0.5rem; color: #cbd5e1;">
                    <label for="image-upload">Image:</label>
                    <input type="file" id="image-upload" accept="image/*" style="color: #cbd5e1; font-size: 0.85rem; cursor: pointer;">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="controls">
                <button id="start-btn" class="control-btn primary">start sorting</button>
                <button id="stop-btn" class="control-btn secondary" disabled>stop</button>
                <button id="reset-btn" class="control-btn secondary">reset image</button>
            </div>
        </div>

        <!-- Canvas Container instead of arrays -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 2rem; background-color: #0b0b0b; border-radius: 8px; padding: 1.5rem; border: 1px solid #222; flex-wrap: wrap;">
            <div style="text-align: center;">
                <p style="color: #888; margin-bottom: 0.5rem; font-size: 0.85rem;">Original / Scrambled</p>
                <canvas id="source-canvas" width="200" height="200" style="background: #1a1a1a; border-radius: 6px; border: 1px solid #333;"></canvas>
            </div>
            <div style="text-align: center;">
                <p style="color: #888; margin-bottom: 0.5rem; font-size: 0.85rem;">Sorting Progress</p>
                <canvas id="target-canvas" width="200" height="200" style="background: #1a1a1a; border-radius: 6px; border: 1px solid #333;"></canvas>
            </div>
        </div>

        <div id="execution-time" style="margin-top: 1rem; text-align: center; font-size: 0.85rem; color: #888888;">
        The backend took <span id="time-val">-</span> ms
        </div>
    </main>

    <script src="js/visualizer.js"></script>
</body>
</html>
