<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AlgoSee - Image Visualization</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-link"><h1 class="logo">AlgoSee</h1></a>
    </header>

   <main class="visualizer-container visualizer-container-custom">
        <div class="visualizer-header">
            <h2 id="algo-title">loading...</h2>
            
            <!-- controls (picture upload) -->
            <div class="speed-control-box">
                <div class="speed-control-inner">
                    <label for="image-upload">Image:</label>
                    <input type="file" id="image-upload" accept="image/*" class="file-input-custom cursor-pointer">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="controls">
                <button id="start-btn" class="control-btn primary">start sorting</button>
                <button id="stop-btn" class="control-btn secondary" disabled>stop</button>
                <button id="reset-btn" class="control-btn secondary">reset image</button>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-wrapper-grid">
            <div class="canvas-box-center">
                <p class="canvas-label">Original / Scrambled</p>
                <canvas id="source-canvas" width="200" height="200" class="canvas-element"></canvas>
            </div>
            <div class="canvas-box-center">
                <p class="canvas-label">Sorting Progress</p>
                <canvas id="target-canvas" width="200" height="200" class="canvas-element"></canvas>
            </div>
        </div>

        <div id="execution-time" class="execution-time-box">
            The backend took <span id="time-val">-</span> ms
        </div>
    </main>

    <script src="js/visualizer.js"></script>
</body>
</html>
